<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кімната механіка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=Roboto:wght@400;500&family=Marck+Script&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0b0c; --panel: #151618; --line: #3a3b3f; --chalk: #ececec; --dim: #9a9ca1;
  --brass: #b08d4a; --brass-hi: #d9b66a; --steel: #8a9099; --navy: #0b1a2b;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--chalk); font-family: 'Roboto', Arial, sans-serif; }
a { color: var(--chalk); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 14px 16px 40px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.top a { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; text-decoration: none; color: var(--dim); }
.top a:hover { color: #fff; }
h1 { font: 800 clamp(20px, 3vw, 28px)/1.1 'Manrope', sans-serif; margin: 0; letter-spacing: -.01em; }
.act-tag { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--brass-hi); }
.stage-box { position: relative; border: 1px solid var(--line); background: #000; overflow: hidden; }
#stage svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.hot { cursor: pointer; }
.hot:hover .hl, .hot:focus .hl { stroke: #fff; opacity: 1; }
.hl { fill: none; stroke: var(--brass-hi); stroke-width: 2; stroke-dasharray: 6 5; opacity: 0; transition: opacity .2s; }
.hint-pulse .hl { opacity: .55; animation: pulse 2.2s infinite; }
@keyframes pulse { 50% { opacity: .15; } }
.flicker { animation: flick 3.4s infinite steps(1, end); }
@keyframes flick { 0%{opacity:.95} 7%{opacity:.5} 9%{opacity:.95} 31%{opacity:.9} 33%{opacity:.35} 36%{opacity:.9} 62%{opacity:.95} 64%{opacity:.6} 66%{opacity:.95} 100%{opacity:.92} }
.say { min-height: 3.2em; margin: 14px 0 6px; font-size: 17px; line-height: 1.5; color: var(--chalk); }
.say.note { font-family: 'Marck Script', cursive; font-size: 22px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 8px; }
.bar .lbl { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); margin-right: 4px; }
.slot { width: 56px; height: 56px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; cursor: pointer; padding: 0; color: var(--chalk); }
.slot.sel { border-color: var(--brass-hi); box-shadow: 0 0 0 2px rgba(217,182,106,.35); }
.slot:empty::after { content: ''; width: 10px; height: 1px; background: var(--line); }
.slot svg { width: 40px; height: 40px; }
.btn { background: var(--chalk); color: #000; border: 1px solid var(--chalk); padding: 12px 22px; font: 600 12px 'Roboto', sans-serif; letter-spacing: .14em; text-transform: uppercase; cursor: pointer; }
.btn:hover { background: transparent; color: var(--chalk); }
.btn.ghost { background: transparent; color: var(--chalk); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--chalk); }
.btn[disabled] { opacity: .35; cursor: default; }
.btn[disabled]:hover { background: var(--chalk); color: #000; }
.tray { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
.wt { min-width: 74px; height: 52px; border: 1px solid var(--steel); background: #1b1d20; color: var(--chalk); font: 800 18px 'Manrope', sans-serif; cursor: pointer; }
.wt.sel { border-color: var(--brass-hi); box-shadow: 0 0 0 2px rgba(217,182,106,.35); }
.wt.used { opacity: .25; cursor: default; }

/* вікно: сторінка лекції, калькулятор */
#modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.78); display: grid; place-items: center; padding: 16px; }
#modal[hidden] { display: none; }
.mbox { position: relative; width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; background: #101113; border: 1px solid var(--chalk); padding: 26px 26px 22px; }
.mx { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--chalk); font-size: 26px; cursor: pointer; line-height: 1; }
.mbox h2 { font: 800 13px 'Manrope', sans-serif; letter-spacing: .2em; text-transform: uppercase; margin: 0 0 14px; color: var(--brass-hi); }
.page p { margin: 0 0 12px; font-family: 'Marck Script', cursive; font-size: 22px; line-height: 1.35; }
.calc-line { display: block; width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px dashed var(--line); color: var(--chalk); padding: 12px 6px; font: 500 20px 'Marck Script', cursive; cursor: pointer; }
.calc-line:hover { background: rgba(255,255,255,.06); }
.calc-line.bad { color: #ff8f8f; }
.calc-line.good { color: #b8e0b8; }
.calc { max-width: 300px; margin: 0 auto; padding: 16px; background: linear-gradient(#2c2d30, #1a1b1d); border: 2px solid var(--steel); border-radius: 6px; }
.calc .scr { height: 54px; margin-bottom: 14px; background: #060707; border: 2px inset #444; color: #e9ffe9; font: 500 30px/54px 'Roboto', monospace; text-align: right; padding: 0 12px; overflow: hidden; letter-spacing: .04em; }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.key { height: 48px; border: 1px solid #555; border-bottom-width: 4px; background: #34363a; color: var(--chalk); font: 600 18px 'Roboto', sans-serif; cursor: pointer; border-radius: 4px; }
.key:active { border-bottom-width: 1px; transform: translateY(3px); }
.key.ok { grid-column: span 2; background: var(--brass); color: #000; }
.key.jam { transform: rotate(-4deg) translateY(2px); background: #25262a; color: #777; border-color: #3a3b3f; cursor: not-allowed; }
.key.jam:nth-child(3n) { transform: rotate(3deg); }
.mmsg { min-height: 2.8em; margin-top: 14px; font-size: 15px; line-height: 1.45; color: var(--chalk); }
.mmsg.err { color: #ff9c9c; }

/* заставка акту */
.card { position: absolute; inset: 0; z-index: 20; background: #000; display: grid; place-items: center; text-align: center; opacity: 0; pointer-events: none; transition: opacity .6s; }
.card.on { opacity: 1; pointer-events: auto; }
.card b { display: block; font: 800 clamp(22px, 5vw, 44px) 'Manrope', sans-serif; letter-spacing: .06em; margin-bottom: 10px; }
.card span { color: var(--brass-hi); letter-spacing: .24em; font-size: 12px; text-transform: uppercase; }

.fall { animation: fall 1.6s cubic-bezier(.3, 1.5, .5, 1) forwards; }
@keyframes fall { from { transform: translateY(-420px) rotate(-140deg); } to { transform: translateY(0) rotate(0); } }
.shake { animation: shake .5s; }
@keyframes shake { 20%{transform:translate(-4px,2px)} 40%{transform:translate(5px,-2px)} 60%{transform:translate(-3px,3px)} 80%{transform:translate(3px,-1px)} }
.spin { animation: spin 5s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes spin { to { transform: rotate(360deg); } }
.wheel-go { animation: wheel 2.6s ease-in-out forwards; transform-box: fill-box; transform-origin: center; }
@keyframes wheel { to { transform: rotate(1080deg); } }
.needle { transition: transform 2.4s ease-in-out; }
.doorL, .doorR { transition: transform 3.2s cubic-bezier(.5, 0, .3, 1); }
.open .doorL { transform: translateX(-250px); }
.open .doorR { transform: translateX(250px); }
.finale { position: absolute; left: 50%; width: min(80%, 400px); transform: translateX(-50%); top: 38%; text-align: center; opacity: 0; transition: opacity 1.4s 1.6s; pointer-events: none; color: #000; padding: 0 16px; }
.finale.on { opacity: 1; pointer-events: auto; }
.finale b { display: block; font: 800 clamp(17px, 2.8vw, 27px)/1.2 'Manrope', sans-serif; margin-bottom: 18px; }
.finale .btn { background: #000; color: #fff; border-color: #000; }
@media (max-width: 560px) { .say { font-size: 15px; } .say.note { font-size: 20px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="act-tag" id="act-tag">Акт 1 з 3</div><h1>Кімната механіка</h1></div>
    <a href="../">← Кабінет студента</a>
  </div>
  <div class="stage-box">
    <div id="stage"></div>
    <div class="card" id="card"><div><b id="card-t"></b><span id="card-s"></span></div></div>
  </div>
  <p class="say note" id="say" role="status" aria-live="polite"></p>
  <div id="tools"></div>
  <div class="bar" id="inv"><span class="lbl">Інвентар</span><button class="slot" id="s-key" type="button" aria-label="Ключ"></button><button class="slot" id="s-gear" type="button" aria-label="Шестерня"></button></div>
</div>
<div id="modal" hidden><div class="mbox"><button class="mx" type="button" aria-label="Закрити">×</button><div id="mbody"></div></div></div>

<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var stage = $('#stage'), sayEl = $('#say'), tools = $('#tools');

  var S = {
    act: 1, sel: null, inv: { key: false, gear: false },
    a1: { defect: false, drawer: false },
    a2: { placed: {}, left: { 2: true, 3: true, 5: true }, solved: false, cracked: false },
    a3: { key: false, gear: false, open: false, spun: false }
  };

  function say(t) { sayEl.textContent = t || ''; }
  function openModal(html) { $('#mbody').innerHTML = html; $('#modal').hidden = false; }
  function closeModal() { $('#modal').hidden = true; $('#mbody').innerHTML = ''; }
  $('#modal').addEventListener('click', function (e) { if (e.target.id === 'modal' || e.target.closest('.mx')) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

  /* ---------- значки інвентарю ---------- */
  var KEY_SVG = '<svg viewBox="0 0 40 40" fill="none" stroke="#d9b66a" stroke-width="2"><circle cx="11" cy="14" r="7"/><circle cx="11" cy="14" r="2.5"/><path d="M16 19 L33 36 M27 30 L31 26 M31 34 L35 30"/><path d="M33 36 l-3 0 M33 36 l0 -3"/></svg>';
  function gearPts(cx, cy, r, n, depth) {
    var p = [], i, a, k = n * 4;
    for (i = 0; i < k; i++) {
      a = (i / k) * Math.PI * 2;
      var rr = (i % 4 < 2) ? r : r - depth;
      p.push((cx + Math.cos(a) * rr).toFixed(1) + ',' + (cy + Math.sin(a) * rr).toFixed(1));
    }
    return p.join(' ');
  }
  var GEAR_SVG = '<svg viewBox="0 0 40 40"><polygon points="' + gearPts(20, 20, 17, 9, 4) + '" fill="#6e5a2e" stroke="#d9b66a" stroke-width="1.5"/><circle cx="20" cy="20" r="5" fill="#0b0b0c" stroke="#d9b66a" stroke-width="1.5"/></svg>';
  function renderInv() {
    $('#s-key').innerHTML = S.inv.key ? KEY_SVG : '';
    $('#s-gear').innerHTML = S.inv.gear ? GEAR_SVG : '';
    $('#s-key').classList.toggle('sel', S.sel === 'key');
    $('#s-gear').classList.toggle('sel', S.sel === 'gear');
  }
  ['key', 'gear'].forEach(function (k) {
    $('#s-' + k).addEventListener('click', function () {
      if (!S.inv[k]) return;
      S.sel = (S.sel === k) ? null : k;
      renderInv();
      if (S.sel) say(k === 'key' ? 'Ключ вибрано. Зуб у формі гайкового ключа. На ручці витиснено: «КЛЮЧ РІВНОВАГИ».' : 'Шестерню вибрано. Вона тепла, ніби щойно з механізму.');
    });
  });

  /* ---------- спільні шматки сцени ---------- */
  var DEFS =
    '<defs>' +
    '<radialGradient id="bgG" cx="31%" cy="30%" r="80%"><stop offset="0" stop-color="#2b2c2f"/><stop offset=".55" stop-color="#101113"/><stop offset="1" stop-color="#050506"/></radialGradient>' +
    '<linearGradient id="cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset="1" stop-color="#fff" stop-opacity=".02"/></linearGradient>' +
    '<linearGradient id="brassG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9b66a"/><stop offset="1" stop-color="#6e5a2e"/></linearGradient>' +
    '<filter id="chalk" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/></filter>' +
    '<filter id="gray"><feColorMatrix type="saturate" values="0"/></filter>' +
    '</defs>';
  function svgOpen(extra) { return '<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Сцена гри">' + DEFS + (extra || ''); }

  /* ====================== АКТ 1 ====================== */
  function scene1() {
    var open = S.a1.drawer, hasKey = !S.inv.key && S.a1.drawer;
    return svgOpen() +
      '<rect width="960" height="600" fill="url(#bgG)"/>' +
      /* дошка-стіна з написами */
      '<g filter="url(#chalk)" fill="#ececec" opacity=".42" font-family="Marck Script, cursive">' +
        '<text x="600" y="90" font-size="34">σ = M / W</text><text x="660" y="140" font-size="28">n = σт / σ</text>' +
        '<text x="590" y="190" font-size="24">Mmax = ?</text>' +
        '<path d="M620 215 q60 -14 160 4" stroke="#ececec" stroke-width="2" fill="none"/>' +
      '</g>' +
      /* лампа */
      '<g class="hot" data-h="lamp" tabindex="0"><line x1="300" y1="0" x2="300" y2="92" stroke="#777" stroke-width="2"/>' +
      '<path d="M254 152 L346 152 L322 94 L278 94 Z" fill="#5a4a26" stroke="#b08d4a" stroke-width="2"/><circle cx="300" cy="154" r="7" fill="#fff"/><rect class="hl" x="246" y="86" width="108" height="76"/></g>' +
      '<polygon class="flicker" points="283,158 317,158 560,470 40,470" fill="url(#cone)"/>' +
      /* стіл */
      '<polygon points="170,330 790,330 880,452 80,452" fill="#1b1c1f" stroke="#cfcfcf" stroke-width="1.5" filter="url(#chalk)"/>' +
      '<rect x="80" y="452" width="800" height="26" fill="#121315" stroke="#cfcfcf" stroke-width="1.5"/>' +
      '<rect x="104" y="478" width="26" height="118" fill="#0f1011" stroke="#555"/><rect x="830" y="478" width="26" height="118" fill="#0f1011" stroke="#555"/>' +
      '<rect x="330" y="478" width="300" height="78" fill="#0d0e10" stroke="#444"/>' +
      /* шухляда */
      '<g class="hot' + (S.a1.drawer ? '' : '') + '" data-h="drawer" tabindex="0" ' + (open ? 'transform="translate(0,26)"' : '') + '>' +
      '<rect x="350" y="486" width="260" height="56" fill="#17181b" stroke="#cfcfcf" stroke-width="1.5"/><circle cx="480" cy="514" r="7" fill="url(#brassG)"/>' +
      '<rect class="hl" x="344" y="480" width="272" height="68"/></g>' +
      (hasKey ? '<g class="hot hint-pulse" data-h="key" tabindex="0" transform="translate(442,512) scale(1.7)"><g transform="rotate(-18 20 20)">' + KEY_SVG.replace('<svg viewBox="0 0 40 40"', '<g').replace('</svg>', '</g>') + '</g><rect class="hl" x="-4" y="2" width="46" height="40"/></g>' : '') +
      /* книга */
      '<g class="hot' + (S.a1.defect ? '' : ' hint-pulse') + '" data-h="book" tabindex="0">' +
      '<polygon points="196,352 332,342 332,424 196,434" fill="#23242a" stroke="#cfcfcf" stroke-width="1.4"/>' +
      '<polygon points="332,342 468,352 468,434 332,424" fill="#292a30" stroke="#cfcfcf" stroke-width="1.4"/>' +
      '<g stroke="#ececec" stroke-width="1.4" opacity=".75" filter="url(#chalk)"><path d="M210 366 L318 360 M210 378 L318 372 M210 390 L300 385 M210 402 L318 396"/><path d="M346 360 L452 366 M346 372 L452 378 M346 384 L430 390"/>' +
      '<circle cx="398" cy="408" r="12" fill="none"/><circle cx="398" cy="408" r="4" fill="none"/></g>' +
      '<text x="212" y="356" font-size="9" fill="#d9b66a" letter-spacing="1.5" font-family="Manrope">ЛЕКЦІЯ №12</text>' +
      '<polygon points="196,434 468,434 462,442 202,442" fill="#6e5a2e"/>' +
      '<polygon class="hl" points="190,346 332,336 474,346 474,446 190,446"/></g>' +
      /* калькулятор */
      '<g class="hot' + (S.a1.defect && !S.a1.drawer ? ' hint-pulse' : '') + '" data-h="calc" tabindex="0">' +
      '<rect x="600" y="338" width="142" height="104" rx="6" fill="#2d2e32" stroke="#9a9ca1" stroke-width="1.5" transform="skewX(-6) translate(40 0)"/>' +
      '<rect x="618" y="350" width="98" height="24" fill="#050606" stroke="#555" transform="skewX(-6) translate(40 0)"/>' +
      '<text x="712" y="368" font-size="15" fill="#c8f5c8" text-anchor="end" font-family="Roboto" transform="skewX(-6) translate(40 0)">n = ?</text>' +
      keysSvg() +
      '<rect class="hl" x="606" y="332" width="150" height="116"/></g>' +
      /* дрібниці: олівець, циркуль */
      '<g stroke="#cfcfcf" stroke-width="2" fill="none" opacity=".8"><path d="M520 436 L590 408"/><path d="M590 408 l8 -3" stroke="#b08d4a"/><path d="M760 425 L800 380 M760 425 L792 392 M800 380 q4 -8 10 -4" /></g>' +
      '<polygon points="0,560 960,560 960,600 0,600" fill="#000" opacity=".5"/>' +
      '</svg>';
  }
  function keysSvg() {
    var s = '<g transform="skewX(-6) translate(40 0)" fill="#3a3b3f" stroke="#777">', r, c, i = 0;
    for (r = 0; r < 3; r++) for (c = 0; c < 6; c++) {
      var rot = (!S.a1.defect && (i === 4 || i === 9 || i === 13)) ? ' transform="rotate(14 ' + (626 + c * 16) + ' ' + (390 + r * 15) + ')"' : '';
      s += '<rect x="' + (619 + c * 16) + '" y="' + (383 + r * 15) + '" width="12" height="10"' + rot + '/>'; i++;
    }
    return s + '</g>';
  }

  function calcModal() {
    var jam = !S.a1.defect;
    var keys = ['7', '8', '9', 'C', '4', '5', '6', '⌫', '1', '2', '3', ',', '0'];
    var html = '<h2>Калькулятор</h2><div class="calc"><div class="scr" id="scr">' + (jam ? '' : '') + '</div><div class="keys">';
    keys.forEach(function (k) { html += '<button type="button" class="key' + (jam ? ' jam' : '') + '" data-k="' + k + '">' + k + '</button>'; });
    html += '<button type="button" class="key ok' + (jam ? ' jam' : '') + '" data-k="OK">n = ?</button></div></div><p class="mmsg" id="mmsg">' +
      (jam ? 'Кнопки заклинило, ніби їх давно ніхто не натискав. Мабуть, спершу треба розібратися з лекцією.' : 'Кнопки вільні. Порахуйте коефіцієнт безпеки n і введіть його.') + '</p>';
    openModal(html);
    var buf = '';
    function paint() { $('#scr').textContent = buf; }
    $('#mbody').querySelector('.keys').addEventListener('click', function (e) {
      var b = e.target.closest('.key'); if (!b || jam) return;
      var k = b.getAttribute('data-k'), m = $('#mmsg');
      m.className = 'mmsg';
      if (k === 'C') { buf = ''; }
      else if (k === '⌫') { buf = buf.slice(0, -1); }
      else if (k === 'OK') {
        var v = parseFloat(buf.replace(',', '.'));
        if (isNaN(v)) { m.textContent = 'Спершу введіть число.'; m.className = 'mmsg err'; return; }
        if (Math.abs(v - 1.5) < 0.005) {
          S.a1.drawer = true; closeModal(); renderScene(); say('Щось клацнуло знизу. Шухляда прочинилась, і в ній щось блищить. Це ключ із зубом у формі гайкового ключа. Візьміть його.');
          return;
        }
        m.className = 'mmsg err';
        if (Math.abs(v - 0.75) < 0.005) m.textContent = 'n = 0,75: так балка б зламалася. Ви взяли Mmax з помилкової формули. Для балки на двох опорах із рівномірним навантаженням Mmax = qL²/8.';
        else if (v < 1) m.textContent = 'n менше за 1: балка руйнується. Перевірте Mmax.';
        else m.textContent = 'Не збігається. Пам’ятайте: σ = Mmax / W, n = σт / σ. Одиниці: кН·м у Н·м, см³ у м³.';
        buf = '';
      } else { if (buf.length < 8 && !(k === ',' && buf.indexOf(',') >= 0)) buf += k; }
      paint();
    });
    paint();
  }
  function bookModal() {
    var d = S.a1.defect;
    var html = '<h2>Лекція №12 · Згин балки</h2><div class="page">' +
      '<p>Дано: q = 10 кН/м, L = 4 м, W = 100 см³, σт = 300 МПа. Балка на двох опорах.</p>' +
      '<p style="font-size:18px;opacity:.8;font-family:Roboto">' + (d ? 'Помилку знайдено. Виправлений рядок 1: Mmax = qL²/8.' : 'У розрахунку заховано брак. Натисніть на рядок, у якому помилка.') + '</p></div>' +
      '<button class="calc-line' + (d ? ' bad' : '') + '" data-l="1">1) Mmax = qL²/4 = 10·4²/4 = 40 кН·м</button>' +
      '<button class="calc-line" data-l="2">2) σ = Mmax / W = 40·10³ / 10⁻⁴ = 400 МПа</button>' +
      '<button class="calc-line" data-l="3">3) n = σт / σ = 300 / 400 = 0,75</button>' +
      '<p class="mmsg" id="mmsg"></p>';
    openModal(html);
    $('#mbody').addEventListener('click', onBookClick);
  }
  function onBookClick(e) {

  /* для перевірки: ?act=2 або ?act=3 */
  var m = /[?&]act=([123])/.exec(location.search);
  if (m) { S.act = +m[1]; if (S.act >= 2) S.inv.key = true; if (S.act === 3) { S.inv.gear = true; } }
  start();
})();
</script>
