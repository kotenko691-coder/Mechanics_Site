<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор збіжної системи сил | Навчальний портал</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            max-width: 1050px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .top-nav { max-width: 1050px; margin: 0 auto 15px auto; }
        .back-btn { display: inline-block; padding: 8px 15px; background: #4a5568; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 14px; transition: background 0.3s; }
        .back-btn:hover { background: #2d3748; }
        h1, h2, h3, h4 { color: #2c3e50; text-align: center; }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .panel {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 330px;
        }
        canvas {
            background-color: #ffffff;
            border: 1px solid #ccc;
            border-radius: 6px;
            display: block;
            margin: 0 auto;
        }
        .form-group { margin-bottom: 12px; }
        label { display: inline-block; width: 170px; font-weight: 600; }
        input[type="number"] {
            width: 90px;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .force-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            background: #f9f9f9;
            padding: 8px;
            border-radius: 4px;
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-add { background-color: #27ae60; color: white; }
        .btn-add:hover { background-color: #219150; }
        .btn-calc { background-color: #2980b9; color: white; width: 100%; font-size: 16px; margin-top: 12px; padding: 12px; }
        .btn-calc:hover { background-color: #1f6391; }
        .btn-del { background-color: #e74c3c; color: white; padding: 4px 8px; }
        .legend {
            font-size: 12px;
            margin-top: 8px;
            display: flex;
            justify-content: space-around;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .box { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="group-ap.html" class="back-btn">← Повернутися на сторінку групи</a>
    </div>

    <h1>Визначення реакцій стержнів у збіжній системі сил</h1>

    <div class="container">
        <!-- 1. Параметри -->
        <div class="panel">
            <h2>1. Геометрія стержнів</h2>
            <div class="form-group">
                <label for="alpha1">Кут стержня 1 (α₁):</label>
                <input type="number" id="alpha1" value="30" step="any" onchange="calculate()"> °
            </div>
            <div class="form-group">
                <label for="alpha2">Кут стержня 2 (α₂):</label>
                <input type="number" id="alpha2" value="150" step="any" onchange="calculate()"> °
            </div>

            <h2>2. Зовнішні сили</h2>
            <div id="forces-container"></div>
            <button class="btn-add" onclick="addForceRow()">+ Додати силу</button>

            <button class="btn-calc" onclick="calculate()">Розрахувати</button>
        </div>

        <!-- 2. Схема -->
        <div class="panel">
            <h2>3. Схема вузла та напрямки реакцій</h2>
            <canvas id="canvas" width="420" height="360"></canvas>
            <div class="legend">
                <div class="legend-item"><span class="box" style="background:#e74c3c;"></span> Зовнішні сили</div>
                <div class="legend-item"><span class="box" style="background:#27ae60;"></span> Розтяг (від вузла)</div>
                <div class="legend-item"><span class="box" style="background:#e67e22;"></span> Стиск (до вузла)</div>
            </div>
        </div>
    </div>

    <!-- 3. Тільки кінцеві результати -->
    <div class="panel" style="margin-top: 20px;">
        <h2>Кінцеві результати розрахунку</h2>
        <div id="final-results-container" style="font-size: 16px; line-height: 1.6;"></div>
    </div>

    <script>
        let forceCount = 0;

        function addForceRow(valF = 20, valDeg = 270) {
            forceCount++;
            const container = document.getElementById('forces-container');
            const div = document.createElement('div');
            div.className = 'force-row';
            div.id = `force-row-${forceCount}`;
            div.innerHTML = `
                <label style="width: auto;">F<sub>${forceCount}</sub>:</label>
                <input type="number" class="force-val" value="${valF}" step="any" onchange="calculate()"> кН
                <label style="width: auto; margin-left: 5px;">β<sub>${forceCount}</sub>:</label>
                <input type="number" class="force-deg" value="${valDeg}" step="any" onchange="calculate()"> °
                <button class="btn-del" onclick="removeForceRow(${forceCount})">✕</button>
            `;
            container.appendChild(div);
            calculate();
        }

        function removeForceRow(id) {
            const row = document.getElementById(`force-row-${id}`);
            if (row) {
                row.remove();
                calculate();
            }
        }

        addForceRow(20, 270);

        function toRad(deg) { return deg * Math.PI / 180; }

        function calculate() {
            const alpha1 = parseFloat(document.getElementById('alpha1').value) || 0;
            const alpha2 = parseFloat(document.getElementById('alpha2').value) || 0;

            const forceVals = document.querySelectorAll('.force-val');
            const forceDegs = document.querySelectorAll('.force-deg');

            let Rx_ext = 0, Ry_ext = 0;
            let forcesData = [];

            forceVals.forEach((input, index) => {
                const F = parseFloat(input.value) || 0;
                const beta = parseFloat(forceDegs[index].value) || 0;
                const betaRad = toRad(beta);

                Rx_ext += F * Math.cos(betaRad);
                Ry_ext += F * Math.sin(betaRad);

                forcesData.push({ F, beta });
            });

            const a1 = toRad(alpha1);
            const a2 = toRad(alpha2);

            const cosA1 = Math.cos(a1), sinA1 = Math.sin(a1);
            const cosA2 = Math.cos(a2), sinA2 = Math.sin(a2);

            const det = cosA1 * sinA2 - sinA1 * cosA2;
            const resContainer = document.getElementById('final-results-container');

            if (Math.abs(det) < 1e-6) {
                resContainer.innerHTML = `<b style="color:red;">Помилка: Стержні розташовані на одній лінії або паралельні (det = 0). Розв'язок неможливий.</b>`;
                return;
            }

            const det1 = (-Rx_ext) * sinA2 - (-Ry_ext) * cosA2;
            const det2 = cosA1 * (-Ry_ext) - sinA1 * (-Rx_ext);

            const S1 = det1 / det;
            const S2 = det2 / det;

            resContainer.innerHTML = `
                <p><b>Реакція стержня 1 (S₁):</b> <span style="color:#2980b9; font-size:18px;">${S1.toFixed(2)} кН</span> — ${S1 >= 0 ? '<span style="color:green; font-weight:bold;">РОЗТЯГ</span>' : '<span style="color:orange; font-weight:bold;">СТИСК</span>'}</p>
                <p><b>Реакція стержня 2 (S₂):</b> <span style="color:#2980b9; font-size:18px;">${S2.toFixed(2)} кН</span> — ${S2 >= 0 ? '<span style="color:green; font-weight:bold;">РОЗТЯГ</span>' : '<span style="color:orange; font-weight:bold;">СТИСК</span>'}</p>
            `;

            drawSchema(alpha1, alpha2, forcesData, S1, S2);
        }

        function drawSchema(alpha1, alpha2, forces, S1, S2) {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const rodLength = 110;

            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy);
            ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            function drawArrow(startX, startY, endX, endY, color, label) {
                const headLen = 9;
                const dx = endX - startX;
                const dy = endY - startY;
                const angle = Math.atan2(dy, dx);

                ctx.strokeStyle = color;
                ctx.fillStyle = color;
                ctx.lineWidth = 2.5;

                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(endX, endY);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(endX, endY);
                ctx.lineTo(endX - headLen * Math.cos(angle - Math.PI / 6), endY - headLen * Math.sin(angle - Math.PI / 6));
                ctx.lineTo(endX - headLen * Math.cos(angle + Math.PI / 6), endY - headLen * Math.sin(angle + Math.PI / 6));
                ctx.fill();

                if (label) {
                    ctx.font = 'bold 12px Arial';
                    ctx.fillText(label, endX + 6 * Math.cos(angle), endY + 6 * Math.sin(angle));
                }
            }

            function drawRodWithReaction(deg, S_val, labelName) {
                const rad = toRad(deg);
                const rx = cx + rodLength * Math.cos(rad);
                const ry = cy - rodLength * Math.sin(rad);

                ctx.strokeStyle = '#7f8c8d';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(rx, ry);
                ctx.stroke();

                ctx.fillStyle = '#95a5a6';
                ctx.beginPath();
                ctx.arc(rx, ry, 6, 0, 2 * Math.PI);
                ctx.fill();
                ctx.stroke();

                const arrowLen = 55;
                const color = S_val >= 0 ? '#27ae60' : '#e67e22';
                const textState = S_val >= 0 ? 'розтяг' : 'стиск';

                if (S_val >= 0) {
                    const ex = cx + arrowLen * Math.cos(rad);
                    const ey = cy - arrowLen * Math.sin(rad);
                    drawArrow(cx, cy, ex, ey, color, `${labelName} = ${Math.abs(S_val).toFixed(1)} кН (${textState})`);
                } else {
                    const sx = cx + arrowLen * Math.cos(rad);
                    const sy = cy - arrowLen * Math.sin(rad);
                    drawArrow(sx, sy, cx, cy, color, `${labelName} = ${Math.abs(S_val).toFixed(1)} кН (${textState})`);
                }
            }

            drawRodWithReaction(alpha1, S1, 'S₁');
            drawRodWithReaction(alpha2, S2, 'S₂');

            forces.forEach((item, index) => {
                if (Math.abs(item.F) < 0.01) return;
                const rad = toRad(item.beta);
                const vecLen = Math.min(Math.max(item.F * 3, 35), 85);
                const ex = cx + vecLen * Math.cos(rad);
                const ey = cy - vecLen * Math.sin(rad);

                drawArrow(cx, cy, ex, ey, '#e74c3c', `F${index + 1} = ${item.F} кН`);
            });

            ctx.fillStyle = '#2c3e50';
            ctx.beginPath();
            ctx.arc(cx, cy, 5, 0, 2 * Math.PI);
            ctx.fill();
        }

        window.onload = calculate;
    </script>
</body>
</html>
